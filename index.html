<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KCPO Music Meaning Editor v10</title>
<style>
:root{--font-ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ja);background:#f5f5f7;color:#1d1d1f;font-size:13px;line-height:1.5}
.shell{display:flex;height:100vh;height:100dvh;border:.5px solid #d2d2d7;overflow:hidden;background:#fff}
.resizer{width:10px;cursor:col-resize;background:transparent;flex-shrink:0;touch-action:none;z-index:10;position:relative;-webkit-tap-highlight-color:transparent}
.resizer:hover,.resizer.dragging{background:rgba(99,153,34,.25)}
.left{width:160px;min-width:80px;flex-shrink:0;flex-grow:0;border-right:.5px solid #d2d2d7;display:flex;flex-direction:column;background:#f9f9fb;overflow:hidden}
.left-top{padding:10px;border-bottom:.5px solid #d2d2d7;flex-shrink:0}
.left-top input{width:100%;padding:6px 10px;border:.5px solid #c7c7cc;border-radius:8px;background:#fff;color:#1d1d1f;font-size:12px;font-family:var(--font-ja);outline:none}
.left-top input:focus{border-color:#639922}
.filters{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.fc{padding:3px 8px;border:.5px solid #c7c7cc;border-radius:20px;font-size:11px;cursor:pointer;color:#6e6e73;background:transparent;font-family:var(--font-ja);white-space:nowrap}
.fc.on{background:#e8f0fb;color:#185FA5;border-color:transparent}
.pcount{font-size:11px;color:#aeaeb2;margin-top:6px}
.plist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pitem{padding:8px 12px;border-bottom:.5px solid #d2d2d7;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:space-between}
.pitem:hover{background:#fff}
.pitem.active{background:#fff;border-left:2px solid #639922}
.pitem.active .pt{color:#1d1d1f}
.pdot{width:6px;height:6px;border-radius:50%;background:#639922;flex-shrink:0;opacity:0}
.pitem.tagged .pdot{opacity:1}
.pinfo{min-width:0;flex:1}
.ptag-cnt{font-size:10px;font-weight:600;color:#639922;background:#EAF3DE;padding:1px 5px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.pc{font-size:11px;color:#aeaeb2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{font-size:12px;color:#6e6e73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:10px 16px;border-bottom:.5px solid #d2d2d7;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.app-title{font-size:13px;font-weight:500;color:#6e6e73}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{padding:5px 12px;border:.5px solid #c7c7cc;border-radius:8px;background:transparent;color:#6e6e73;font-size:12px;font-family:var(--font-ja);cursor:pointer}
.btn:hover{background:#f9f9fb}
.btn-primary{background:#639922;color:#173404;border-color:#639922;font-weight:500}
.btn-primary:hover{background:#3B6D11;color:#C0DD97}
.btn-ai{background:#e8f0fb;color:#185FA5;border-color:transparent}
.stat-row{display:flex;gap:16px;padding:8px 16px;border-bottom:.5px solid #d2d2d7;flex-shrink:0;background:#f9f9fb}
.stat{text-align:center}.stat-n{font-size:15px;font-weight:500;color:#639922}.stat-l{font-size:10px;color:#aeaeb2}
.ss-msg{font-size:11px;color:#639922;font-weight:500}
.editor{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px}
.no-sel{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#aeaeb2;gap:6px;text-align:center}
.no-sel-icon{font-size:32px;opacity:.4}
.piece-composer{font-size:11px;font-weight:500;color:#639922;letter-spacing:.05em;margin-bottom:3px}
.piece-title{font-size:17px;font-weight:500;color:#1d1d1f;line-height:1.3;margin-bottom:6px}
.piece-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;border:.5px solid #c7c7cc;color:#6e6e73}
.badge.yr{border-color:#b8d4f5;color:#185FA5}
.etags-sec{margin-bottom:14px}
.etags-label{font-size:11px;color:#aeaeb2;margin-bottom:5px;font-weight:500}
.etag{display:inline-flex;padding:2px 8px;border-radius:20px;border:.5px solid #3B6D11;background:#EAF3DE;color:#27500A;font-size:11px;margin:2px}
.ai-banner{padding:8px 12px;border:.5px solid #b8d4f5;border-radius:8px;background:#e8f0fb;margin-bottom:14px}
.ai-banner-txt{font-size:12px;color:#185FA5;font-weight:500}
.ai-status{font-size:11px;color:#185FA5;margin-top:3px;opacity:.8}
.cat-section{margin-bottom:14px}
.cat-hdr{display:flex;align-items:center;justify-content:space-between;padding:4px 0 6px;border-bottom:.5px solid #d2d2d7;margin-bottom:8px}
.cat-name{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#aeaeb2}
.cat-count{font-size:11px;color:#639922;font-weight:600;background:#EAF3DE;padding:1px 7px;border-radius:20px}
.tags-row{display:flex;flex-wrap:wrap;gap:6px}
.tchip{padding:5px 12px;border:1px solid #c7c7cc;border-radius:20px;background:#fff;color:#6e6e73;font-size:12px;font-family:var(--font-ja);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;transition:border-color .1s,background .1s,color .1s}
.tchip:hover{border-color:#639922;color:#27500A}
.tchip.on{background:#EAF3DE;border-color:#3B6D11;color:#173404;font-weight:600}
.tchip.ai-prop{border-color:#185FA5;background:#e8f0fb;color:#0C447C}
.add-cat-wrap{margin-top:6px}
.add-cat-wrap button{width:100%;padding:7px 0;border:1px dashed #c7c7cc;border-radius:8px;background:transparent;color:#aeaeb2;font-size:12px;font-family:var(--font-ja);cursor:pointer}
.add-cat-wrap button:hover{background:#f9f9fb;color:#6e6e73}
.save-bar{padding:10px 16px;border-top:.5px solid #d2d2d7;display:flex;align-items:center;gap:10px;flex-shrink:0;background:#fff}
.save-preview{flex:1;font-size:11px;color:#aeaeb2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c7c7cc;border-radius:2px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:28px 28px 24px;width:360px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-title{font-size:14px;font-weight:600;color:#1d1d1f;margin-bottom:6px;line-height:1.5}
.modal-sub{font-size:12px;color:#6e6e73;margin-bottom:18px}
.modal-label{font-size:11px;font-weight:500;color:#aeaeb2;margin-bottom:4px}
.modal-input{width:100%;padding:8px 10px;border:.5px solid #c7c7cc;border-radius:8px;font-size:13px;font-family:var(--font-ja);outline:none;margin-bottom:14px}
.modal-input:focus{border-color:#639922}
.modal-textarea{width:100%;padding:8px 10px;border:.5px solid #c7c7cc;border-radius:8px;font-size:13px;font-family:var(--font-ja);outline:none;resize:vertical;min-height:80px;margin-bottom:6px}
.modal-textarea:focus{border-color:#639922}
.modal-count{font-size:10px;color:#aeaeb2;text-align:right;margin-bottom:18px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div class="modal-overlay" id="export-modal">
  <div class="modal-box">
    <div class="modal-title">タグ付けありがとうございます！<br>お名前を教えて下さい。<br>また、ご意見やご指摘など、メッセージがあればぜひ&#127926;</div>
    <div class="modal-label">お名前</div>
    <input class="modal-input" id="export-name" type="text" placeholder="例：山田太郎（必須）" maxlength="50" required>
    <div class="modal-label">メッセージ（任意）</div>
    <textarea class="modal-textarea" id="export-msg" placeholder="自由にどうぞ" maxlength="200"></textarea>
    <div class="modal-count"><span id="msg-count">0</span> / 200</div>
    <div style="font-size:11px;color:#aeaeb2;margin-bottom:14px;line-height:1.6">&#9993; 端末にダウンロードされたJSONファイルをメールに添付して下さい</div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">キャンセル</button>
      <button class="btn btn-primary" id="modal-ok">添付してメールを送る</button>
    </div>
  </div>
</div>

<div class="shell">
  <div class="left">
    <div class="left-top">
      <input id="qi" type="text" placeholder="曲名・作曲家を検索">
      <div class="filters">
        <button class="fc on" id="f-all">すべて</button>
        <button class="fc" id="f-tagged">タグ付き</button>

        <button class="fc" id="f-sym">交響曲</button>
      </div>
      <div class="pcount" id="pcnt"></div>
    </div>
    <div class="plist" id="plist"></div>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="right">
    <div class="top-bar">
      <span class="app-title">KCPO Music Meaning Editor</span>
      <div class="top-actions">
        <span class="ss-msg" id="ssmsg"></span>
        <button class="btn btn-ai" id="btn-ai" style="display:none">AI提案</button>
        <button class="btn btn-primary" id="btn-save">保存</button>

    </div>
    <div class="stat-row">

      <div class="stat"><div class="stat-n" id="st-cov">0%</div><div class="stat-l">カバレッジ</div></div>
    </div>
    <div class="editor" id="editor">
      <div class="no-sel" id="nosel">
        <div class="no-sel-icon">♩</div>
        <div style="font-size:14px;font-weight:500">楽曲を選択してください</div>
        <div style="font-size:12px;margin-top:4px">左のリストから曲を選ぶとタグ編集が始まります</div>
      </div>
      <div id="econtent" style="display:none"></div>
    </div>
    <div class="save-bar">
      <div class="save-preview" id="spreview">タグ未設定</div>
      <button class="btn btn-primary" id="btn-save2">保存</button>
    </div>
  </div>
</div>

let DB={},cur=null,filt='',aiProp=[];

function loadDB(){
  // PRESETSをベースとして展開（ID配列）
  Object.entries(PRESETS).forEach(function(entry){
    DB[entry[0]]=[].concat(entry[1]);
  });
  // 有効なタグIDセット（未知IDをマージしないためのフィルタ）
  var validIds=new Set(Object.keys(TAG_LABEL));
  // localStorageのユーザー追加タグをマージ（有効IDのみ）
  try{
    var s=localStorage.getItem('kcpo-v13');
    if(s){
      var saved=JSON.parse(s);
      Object.entries(saved).forEach(function(entry){
        var pid=entry[0], ids=entry[1];
        if(!DB[pid])return;
        var base=new Set(DB[pid]);
        (ids||[]).forEach(function(tid){
          // TAG_LABELに存在するIDのみ追加（旧ID・不正IDを排除）
          if(validIds.has(tid)&&!base.has(tid)){DB[pid].push(tid);base.add(tid);}
        });
      });
    }
  }catch(e){}
  try{localStorage.setItem('kcpo-v13',JSON.stringify(DB));}catch(e){}
}
function saveDB(){try{localStorage.setItem('kcpo-v13',JSON.stringify(DB));}catch(e){}}
function getMT(id){
  return (DB[id]||[]).map(function(tid){
    return {id:tid,label:TAG_LABEL[tid]||tid};
  });
}
function hasMT(id){return !!(DB[id]&&DB[id].length)}
function isOn(pid,tagId){return (DB[pid]||[]).includes(tagId);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function togTag(tagId){
  if(!cur)return;
  if(!DB[cur])DB[cur]=[];
  const i=DB[cur].indexOf(tagId);
  if(i>=0)DB[cur].splice(i,1);else DB[cur].push(tagId);
  saveDB();renderTags();updateMtPreview();updatePreview();updateStats();
}

function renderList(){
  const q=document.getElementById('qi').value.trim().toLowerCase();
  const ps=PIECES.filter(p=>{
    if(q&&!(p.cmp+p.en+p.title).toLowerCase().includes(q))return false;
    if(filt==='tagged')return hasMT(p.id);
    if(filt==='none')return !hasMT(p.id);
    if(filt==='sym')return !!p.isSym;
    return true;
  }).slice().sort(function(a,b){
    // 第1キー: 作曲家名アルファベット順 (en)
    var ea=(a.en||a.cmp).toLowerCase();
    var eb=(b.en||b.cmp).toLowerCase();
    if(ea<eb)return -1;
    if(ea>eb)return 1;
    // 第2キー: ID数字部分の昇順（p0001→p0002…の自然順）
    var na=parseInt(a.id.replace('p',''),10)||0;
    var nb=parseInt(b.id.replace('p',''),10)||0;
    return na-nb;
  });
  document.getElementById('plist').innerHTML=ps.map(p=>
    '<div class="pitem'+(cur===p.id?' active':'')+(hasMT(p.id)?' tagged':'')+'" data-id="'+esc(p.id)+'">'
    +'<div class="pdot"></div>'
    +'<div class="pinfo"><div class="pc">'+(p.en&&p.en!==p.cmp?esc(p.cmp)+' '+esc(p.en):esc(p.cmp))+'</div><div class="pt">'+esc(p.title)+'</div></div>'
    +(getMT(p.id).length>0?'<span class="ptag-cnt">'+getMT(p.id).length+'</span>':'')
    +'</div>'
  ).join('');
  document.getElementById('pcnt').textContent=ps.length+' / '+PIECES.length+' 曲';
  document.querySelectorAll('.pitem').forEach(el=>{
    el.addEventListener('click',()=>selPiece(el.dataset.id));
  });
}

function setF(f){
  filt=(filt===f)?'':f;
  document.querySelectorAll('.fc').forEach(b=>b.classList.remove('on'));
  document.getElementById({'':'f-all','tagged':'f-tagged','none':'f-none','sym':'f-sym'}[filt]).classList.add('on');
  renderList();
}

function selPiece(id){
  cur=id;aiProp=[];
  CATS.forEach(c=>{c.v=c.dv;});
  renderList();renderEditor();
}

function renderEditor(){
  const p=PIECES.find(x=>x.id===cur);if(!p)return;
  document.getElementById('nosel').style.display='none';
  const ec=document.getElementById('econtent');
  ec.style.display='block';

  ec.innerHTML=
    '<div style="margin-bottom:12px">'
    +'<div class="piece-composer">'+(p.en&&p.en!==p.cmp?esc(p.cmp)+' '+esc(p.en):esc(p.cmp))+'</div>'
    +'<div class="piece-title">'+esc(p.title)+'</div>'
    +'<div class="piece-meta"><span class="badge">'+p.dur+'分</span><span class="badge yr">'+esc(yr)+'</span></div>'
    +'</div>'
    +'<div class="etags-sec">'
    +'<div class="etags-label">意味タグ</div>'
    +'<div id="mt-preview">'
    +(getMT(p.id).length
      ? getMT(p.id).map(x=>'<span class="etag">'+esc(x.label)+'</span>').join('')
      : '<span style="font-size:11px;color:#aeaeb2">未設定</span>')
    +'</div>'
    +'</div>'


    +'<div id="tagcats"></div>';

}

function renderTags(){
  const el=document.getElementById('tagcats');
  if(!el||!cur)return;
  const visible=CATS.filter(c=>c.v);
  const hidden=CATS.filter(c=>!c.v);
  const catsHtml=visible.map(cat=>{
    const sel=(DB[cur]||[]).filter(function(tid){return cat.core.some(function(tc){return tc.id===tid;});}).length;
    const chips=cat.core.map(function(tc){
      const on=isOn(cur,tc.id);
      const ai=aiProp.indexOf(tc.id)>=0;
      return '<button class="tchip'+(on?' on':'')+(ai&&!on?' ai-prop':'')+'" data-tagid="'+esc(tc.id)+'">'+esc(tc.label)+'</button>';
    }).join('');
    return '<div class="cat-section">'
      +'<div class="cat-hdr"><span class="cat-name">'+esc(cat.name)+'</span>'+(sel?'<span class="cat-count">'+sel+'</span>':'')+'</div>'
      +'<div class="tags-row">'+chips+'</div>'
      +'</div>';
  }).join('');
  const addBtn=hidden.length>0
    ?'<div class="add-cat-wrap"><button id="add-cat-btn">+ カテゴリを追加（残り'+hidden.length+'件）</button></div>'
    :'';
  el.innerHTML=catsHtml+addBtn;
  el.querySelectorAll('.tchip').forEach(b=>{
    b.addEventListener('click',ev=>{ev.stopPropagation();togTag(b.dataset.tagid);});
  });
  const ab=document.getElementById('add-cat-btn');
  if(ab)ab.addEventListener('click',()=>{
    const next=CATS.find(c=>!c.v);
    if(next){next.v=true;renderTags();}
  });
}

function updateMtPreview(){
  const el=document.getElementById('mt-preview');
  if(!el||!cur)return;
  const mt=getMT(cur);
  el.innerHTML=mt.length
    ?mt.map(x=>'<span class="etag">'+esc(x.label)+'</span>').join('')
    :'<span style="font-size:11px;color:#aeaeb2">未設定</span>';
}
function updatePreview(){
  const mt=getMT(cur);
  document.getElementById('spreview').textContent=mt.length
    ?mt.map(x=>x.label).join(' · '):'タグ未設定';
}
function updateStats(){
  const total=PIECES.length;
  const tagged=PIECES.filter(p=>hasMT(p.id)).length;
  // PIECES に含まれる曲だけを集計（古いDBキーを排除）
  const pidSet=new Set(PIECES.map(p=>p.id));
  const totalT=PIECES.reduce((s,p)=>s+(getMT(p.id).length),0);
  const avg=tagged>0?(totalT/tagged).toFixed(1)+'件':'0件';
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-tagged').textContent=tagged;
  document.getElementById('st-tags').textContent=totalT;
  document.getElementById('st-avg').textContent=avg;
  document.getElementById('st-cov').textContent=Math.round(tagged/total*100)+'%';
}

function runExport(userName, userMsg){
  const date=new Date().toISOString();
  const data={
    exportedAt:date,
    exportedBy:userName,
    message:userMsg||'',
    pieces:PIECES.filter(p=>getMT(p.id).length>0).map(p=>({
      piece:p.title,
      id:p.id,
      composer:p.cmp,
      annotations:[{
        user:userName,
        tags:getMT(p.id).map(x=>({id:x.id,label:x.label}))
      }]
    }))
  };
  // ① JSONファイルをダウンロード
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const fname='kcpo-tags-'+userName+'-'+new Date().toISOString().slice(0,10)+'.json';
  a.download=fname;
  a.click();URL.revokeObjectURL(a.href);

  // ② メールアプリを開く（宛先・件名・本文を自動入力）
  setTimeout(function(){
    var tagged=data.pieces;
    var subject=encodeURIComponent('【KCPOタグ付け結果】'+userName+' '+new Date().toISOString().slice(0,10));
    // 本文: 名前・メッセージ・曲ごとのタグ一覧（ラベル形式）
    var lines=[];
    lines.push('差出人: '+userName);
    if(userMsg)lines.push('メッセージ: '+userMsg);
    lines.push('');
    lines.push('■ タグ付け結果（'+tagged.length+'曲）');
    lines.push('');
    tagged.forEach(function(p){
      var labels=p.annotations[0].tags.map(function(t){return t.label;}).join(' / ');
      lines.push('▶ '+p.composer+' '+p.piece);
      lines.push('  '+labels);
      lines.push('');
    });
    lines.push('---');
    lines.push('添付ファイル名: '+fname);
    lines.push('（JSONファイルをこのメールに添付してください）');
    var body=encodeURIComponent(lines.join('\n'));
    // mailto: は本文が長すぎるとブラウザが切り捨てるため2000文字で制限
    var bodyStr=lines.join('\n');
    if(bodyStr.length>2000){
      var short=[];
      short.push('差出人: '+userName);
      if(userMsg)short.push('メッセージ: '+userMsg);
      short.push('');
      short.push('タグ付け完了: '+tagged.length+'曲');
      short.push('詳細はダウンロードしたJSONファイルをご確認ください。');
      short.push('（添付してください: '+fname+'）');
      body=encodeURIComponent(short.join('\n'));
    }
    window.location.href='mailto:clarinetist3@gmail.com?subject='+subject+'&body='+body;
  },800);
}

async function proposeAI(){
  if(!cur){alert('曲を選択してください');return;}
  let key=(localStorage.getItem('kcpo-api-key')||'').trim();
  if(!key){key=(prompt('Anthropic APIキーを入力:')||'').trim();if(!key)return;localStorage.setItem('kcpo-api-key',key);}
  const p=PIECES.find(x=>x.id===cur);
  const st=document.getElementById('ai-st');
  if(st)st.textContent='AIが分析中…';
  const tagList=CATS.flatMap(c=>c.core.map(t=>'{"category":"'+c.name+'","tag":"'+t+'"}')).join(',\n');
  const sys='あなたはKCPOの選曲分類補助AIです。以下の制約を必ず守ってください：\n'
    +'1. タグは下記「使用可能タグリスト」に含まれるものだけを選択すること\n'
    +'2. 新しいタグの作成・提案は絶対に禁止\n'
    +'3. 回答はJSON形式のみ。説明文不要\n'
    +'4. 10〜15個のタグを選ぶこと\n\n'
    +'使用可能タグリスト（このリスト外のタグは使用不可）:\n['+tagList+']';
  const usr='楽曲「'+p.title+'」（作曲家:'+(p.en||p.cmp)+'、演奏時間:'+p.dur+'分）にふさわしい意味タグを上記リストから10〜15個選んでください。\n'
    +'回答形式: {"tags":[{"category":"感情","tag":"崇高"}, ...]}';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:sys,messages:[{role:'user',content:usr}]})
    });
    const d=await res.json();
    const txt=(d.content?.[0]?.text||'').trim();
    const m=txt.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('JSON形式で応答がありませんでした');
    const parsed=JSON.parse(m[0]);
    const rawTags=(parsed.tags||[]).map(x=>({c:x.category,t:x.tag}));
    aiProp=rawTags.filter(x=>VALID_TAG_SET.has(x.c+'::'+x.t));
    const rejected=rawTags.length-aiProp.length;
    if(!DB[cur])DB[cur]=[];
    let added=0;
    aiProp.forEach(x=>{if(!isOn(cur,x.c,x.t)){DB[cur].push({c:x.c,t:x.t});added++;}});
    saveDB();renderTags();updatePreview();updateStats();
    let msg=added+'個のタグを追加しました ✓';
    if(rejected>0)msg+='（未定義タグ'+rejected+'件を除外）';
    if(st)st.textContent=msg;
  }catch(err){
    if(st)st.textContent='エラー: '+err.message;
  }
}

// ── パネルリサイザー（Pointer Events API / iOS対応） ──
(function(){
  var rz=document.getElementById('resizer');
  var lp=document.querySelector('.left');
  var dragging=false, startX=0, startW=0;

  function onDown(e){
    e.preventDefault();
    dragging=true;
    startX=(e.touches?e.touches[0]:e).clientX;
    startW=lp.offsetWidth;
    rz.classList.add('dragging');
    document.body.style.userSelect='none';
    document.body.style.webkitUserSelect='none';
    document.body.style.cursor='col-resize';
  }
  function onMove(e){
    if(!dragging)return;
    e.preventDefault();
    var cx=(e.touches?e.touches[0]:e).clientX;
    var w=Math.max(80,Math.min(400,startW+(cx-startX)));
    lp.style.width=w+'px';
  }
  function onUp(){
    if(!dragging)return;
    dragging=false;
    rz.classList.remove('dragging');
    document.body.style.userSelect='';
    document.body.style.webkitUserSelect='';
    document.body.style.cursor='';
  }

  // マウス
  rz.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  // タッチ（passive:false でスクロール抑制、rz上のみで登録）
  rz.addEventListener('touchstart', onDown, {passive:false});
  rz.addEventListener('touchmove',  onMove, {passive:false});
  rz.addEventListener('touchend',   onUp,   {passive:false});
})();
